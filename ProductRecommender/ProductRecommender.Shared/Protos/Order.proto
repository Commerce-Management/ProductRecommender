syntax = "proto3";

option csharp_namespace = "ProductRecommender.Shared.Protos.GrpcOrderService";
package order;

service OrderService {
  rpc GetAllUserOrders (GetAllUserOrderRequest) returns (GetAllUserOrderResponse);
  rpc GetOrderStatusByProductIdAndUserId (GetOrderStatusByProductIdAndUserIdRequest) returns (GetOrderStatusByProductIdAndUserIdResponse);
  rpc GetPurchasedProductIdsByUserId (GetPurchasedProductIdsByUserIdRequest) returns (GetPurchasedProductIdsByUserIdResponse);
}

message GetAllUserOrderRequest {
  string user_id = 1;
}

message OrderProduct {
  string product_id = 2;
}

message GetAllUserOrderResponse {
  repeated OrderProduct items = 1;
}

message GetOrderStatusByProductIdAndUserIdRequest {
  string product_id = 1;
  string user_id = 2;
}

message GetOrderStatusByProductIdAndUserIdResponse {
  bool exists = 1;
  string status = 2;
}

message GetPurchasedProductIdsByUserIdRequest {
  string user_id = 1;
}

message GetPurchasedProductIdsByUserIdResponse {
  repeated string product_ids = 1;
}
syntax = "proto3";

option csharp_namespace = "ProductRecommender.Shared.Protos.GrpcRatingService";
package rating;

service RatingService {
  rpc GetReviewsByUserId (GetReviewsByUserIdRequest) returns (GetReviewsByUserIdResponse);
  rpc GetReviewsByUserIdAndRating (GetReviewsByUserIdAndRatingRequest) returns (GetReviewsByUserIdAndRatingResponse);
  rpc GetActiveUsersForTraining (GetActiveUsersForTrainingRequest) returns (GetActiveUsersForTrainingResponse); // ← НОВЫЙ
}

message GetReviewsByUserIdRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetReviewsByUserIdResponse {
  repeated ReviewBrief reviews = 1;
}


message GetReviewsByUserIdAndRatingRequest {
  string user_id = 1;
  int32 min_rating = 2;
  int32 max_rating = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message GetReviewsByUserIdAndRatingResponse {
  repeated ReviewBrief reviews = 1;
}

message ReviewBrief {
  string id = 1;
  string product_id = 2;
  string user_id = 3;
  int32 rating = 4;
  string title = 5;
  string text = 6;
  repeated string image_urls = 7;
  bool is_anonymous = 8;
  string created_at = 9;
}


message GetActiveUsersForTrainingRequest {
  int32 min_reviews = 1;      // минимум отзывов
  int32 max_users = 2;         // максимум пользователей
}

message GetActiveUsersForTrainingResponse {
  repeated string user_ids = 1;
}